# Shared look (IBM Plex Sans and the dashboard's blue). Colours live in [theme.light] / [theme.dark]; the app follows the viewer's
# system setting, and viewers can switch with System / Light / Dark in the top-right menu.
[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
showWidgetBorder = true
baseRadius = "medium"

[theme.light]
primaryColor = "#0369A1"  # same accent as the Power BI dashboard
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF3F8"
textColor = "#0F172A"
borderColor = "#D5DEE8"

[theme.dark]
primaryColor = "#3B82F6"  # white chip text stays readable (3.7:1) and so do links on the dark background
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
borderColor = "#334155"

[client]
# "viewer" keeps the menu so visitors can reach the theme switch
toolbarMode = "viewer"
