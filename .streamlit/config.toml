# Shared look. Colours live in [theme.light] / [theme.dark]; the app follows the viewer's
# system setting, and viewers can switch with System / Light / Dark in the top-right menu.
[theme]
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
showWidgetBorder = true
baseRadius = "medium"

[theme.light]
primaryColor = "#1E40AF"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E9EEF6"
textColor = "#0F172A"
borderColor = "#DBEAFE"

[theme.dark]
primaryColor = "#3B82F6"  # white tag text and blue-on-dark both stay readable
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
borderColor = "#334155"

[client]
# "viewer" keeps the menu so visitors can reach the theme switch
toolbarMode = "viewer"
